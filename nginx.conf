events {
    worker_connections 2048;
}

http {
    access_log off;

    server {
        listen 80;
        client_max_body_size 50m;

        location / {
            # Docker's embedded DNS server. Re-resolving on a short TTL is what makes
            # `docker compose up --scale api=5` actually spread load across the new
            # replicas: without this, nginx would resolve `api` once at startup and
            # pin every request to the first container it found.
            resolver 127.0.0.11 valid=5s ipv6=off;
            set $upstream_api api;

            proxy_pass http://$upstream_api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
        }
    }
}
