# Render blueprint: two services from one repo.
# Note: Since this is using the free tier, there is no persistent disk.
# Uploaded images and retrained models will be cleared if the server restarts.
services:
  - type: web
    name: cifar-mlops-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LABEL_MODE
        value: coarse
      - key: DATA_DIR
        value: /data
      - key: DB_PATH
        value: /data/mlops.db
      - key: MODELS_DIR
        value: /data/models

  - type: web
    name: cifar-mlops-ui
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    plan: free
    envVars:
      - key: LABEL_MODE
        value: coarse
      - key: API_URL
        sync: false   # paste the API service's public URL here after the first deploy
